name: controlled-response-qualification

on:
  push:
    branches: [consultations/controlled-response]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: controlled-response-${{ github.ref }}
  cancel-in-progress: false

jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_BUILD_JOBS: "2"
    defaults:
      run:
        working-directory: codex-rs
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-ci
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update -y
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends build-essential pkg-config libcap-dev libasound2-dev bubblewrap
      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582
        with:
          components: rustfmt, clippy
      - uses: taiki-e/install-action@44c6d64aa62cd779e873306675c7a58e86d6d532
        with:
          tool: nextest
          version: 0.9.103
      - uses: ./.github/actions/setup-rusty-v8
        with:
          target: x86_64-unknown-linux-gnu
      - name: Build integration test helpers
        run: cargo build --locked -p codex-rmcp-client --bin test_stdio_server -p codex-code-mode-host --bin codex-code-mode-host -p codex-bwrap --bin bwrap
      - name: Check Rust formatting
        run: cargo fmt -- --config imports_granularity=Item --check
      - name: Build the executable required by integration tests
        run: cargo build --locked -p codex-cli --bin codex
      - name: Test affected crates including opt-out behavior
        run: just test --locked -p codex-core -p codex-api
      - name: Record executable identity
        run: |
          git rev-parse HEAD
          rustc --version
          sha256sum "$CARGO_TARGET_DIR/debug/codex"
      - name: Check generated files stayed unchanged
        run: git diff --exit-code
